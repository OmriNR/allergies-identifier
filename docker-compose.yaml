services:
  mongo:
    image: mongo:7
    container_name: aller-scan-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-aller_scan}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./aller-scan-api
      dockerfile: Dockerfile
    image: aller-scan-api:local
    container_name: aller-scan-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-aller-scan-api}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-changeme123}
      SECRET_KEY: ${SECRET_KEY:-}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_DB: ${MONGO_DB:-aller_scan}
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/api/v1/openapi.json')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Only builds/starts once `api` reports healthy above.
  frontend:
    build:
      context: ./aller-scan
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_FOOD_FACTS_API_BASE_URL: ${VITE_FOOD_FACTS_API_BASE_URL:-https://world.openfoodfacts.net/api/v3.6}
    image: aller-scan-frontend:local
    container_name: aller-scan-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mongo_data:
