[project]
name = "aller-scan-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Omri Nir", email = "omrinir12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "beanie>=2.0.0",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt<4.1",
    "passlib[bcrypt]>=1.7.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mongomock-motor>=0.0.36",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
